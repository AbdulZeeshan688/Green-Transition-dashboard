# Netlify build settings for the Green Transition Dashboard (frontend/).
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite needs Node 22.12 or newer.
  NODE_VERSION = "22"
  # No backend is hosted yet, so the online demo uses the sample routes.
  # Remove this line once the backend is online.
  VITE_ROUTE_SOURCE = "local"

# Data files can be edited without a rebuild of the code; never cache them.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

# Built JS/CSS have content hashes in their names, so they can be cached long.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
