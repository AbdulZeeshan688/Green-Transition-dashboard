# Builds the Green Transition Dashboard (frontend/) and deploys it to the
# Azure Static Web App "dashboard" (resource group rg_EMDT).
name: Azure Static Web Apps CI/CD

trigger:
  branches:
    include:
      - main
pr:
  branches:
    include:
      - main

jobs:
- job: build_and_deploy_job
  displayName: Build and Deploy Job
  pool:
    vmImage: ubuntu-latest
  variables:
  - group: Azure-Static-Web-Apps-black-forest-00789f103-variable-group
  steps:
  - checkout: self
    submodules: true
  - task: AzureStaticWebApp@0
    inputs:
      azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_FOREST_00789F103)
      app_location: "/frontend"
      api_location: ""
      output_location: "dist"
    env:
      VITE_BACKEND_URL: https://emdt-greentransition-api-cyfdbbhtbmdwcpdb.westeurope-01.azurewebsites.net
