# Builds the dashboard (frontend/) and deploys it to Azure Static Web Apps.
# - Push to main            → updates the live site
# - Pull request            → a temporary preview site, removed when the PR closes
# Setup (once): see docs/AZURE.md. Needs the repository secret
# AZURE_STATIC_WEB_APPS_API_TOKEN and, when the backend is hosted, the
# repository variable BACKEND_URL.
name: Azure Static Web App

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -n "$BACKEND_URL" ]; then
            echo "Using the hosted backend: $BACKEND_URL"
            VITE_BACKEND_URL="$BACKEND_URL" npm run build
          else
            echo "No BACKEND_URL variable yet: the site uses the sample routes."
            VITE_ROUTE_SOURCE=local npm run build
          fi

      - name: Deploy to Azure
        if: env.HAS_TOKEN == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/dist
          output_location: ""
          skip_app_build: true

      - name: Deploy skipped
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Not deployed. Add the AZURE_STATIC_WEB_APPS_API_TOKEN secret (see docs/AZURE.md)."

  close_preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - name: Remove the preview site
        if: env.HAS_TOKEN == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          app_location: ""
